services:
  checkcc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_REPO_URL: ${NEXT_PUBLIC_REPO_URL:-https://github.com/Brilliant666/check-cc}
        NEXT_PUBLIC_IP_INTEL_ENABLED: ${NEXT_PUBLIC_IP_INTEL_ENABLED:-true}
        NEXT_PUBLIC_IP_INTEL_ENDPOINT: ${NEXT_PUBLIC_IP_INTEL_ENDPOINT:-https://ipwho.is/}
        NEXT_PUBLIC_IP_INTEL_FALLBACK_ENDPOINT: ${NEXT_PUBLIC_IP_INTEL_FALLBACK_ENDPOINT-https://ipapi.co/json/}
        NEXT_PUBLIC_WEBRTC_STUN_URL: ${NEXT_PUBLIC_WEBRTC_STUN_URL:-stun:stun.cloudflare.com:3478}
        NEXT_PUBLIC_IPV6_ENDPOINT: ${NEXT_PUBLIC_IPV6_ENDPOINT:-https://api6.ipify.org?format=json}
    image: checkcc:local
    container_name: checkcc
    restart: unless-stopped
    ports:
      - "${CHECKCC_BIND:-0.0.0.0}:${CHECKCC_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
